name: Build and deploy the application site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run core tests
        run: node --test tests/rendered-html.test.mjs

      - name: Prepare encrypted Worker secrets
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_GUEST_TABLE_ID: ${{ secrets.FEISHU_GUEST_TABLE_ID }}
          FEISHU_STAFF_TABLE_ID: ${{ secrets.FEISHU_STAFF_TABLE_ID }}
        run: >-
          node -e "require('node:fs').writeFileSync('.worker-secrets.json',
          JSON.stringify({FEISHU_APP_ID:process.env.FEISHU_APP_ID,
          FEISHU_APP_SECRET:process.env.FEISHU_APP_SECRET,
          FEISHU_APP_TOKEN:process.env.FEISHU_APP_TOKEN,
          FEISHU_GUEST_TABLE_ID:process.env.FEISHU_GUEST_TABLE_ID,
          FEISHU_STAFF_TABLE_ID:process.env.FEISHU_STAFF_TABLE_ID}))"

      - name: Deploy to Cloudflare Workers
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deploy
          --config dist/server/wrangler.json
          --secrets-file .worker-secrets.json
          --keep-vars

      - name: Remove temporary secrets file
        if: ${{ always() }}
        run: rm -f .worker-secrets.json
